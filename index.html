<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Unipar 2026 - Reporte Prensa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unipar: {
                            green: '#00A859',
                            dark: '#0B2027',
                            light: '#F4F7F6'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.6.0/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SheetJS (Excel Parser) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F4F7F6; }
        .card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 1.5rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .recharts-pie-label-text { font-weight: 600; font-size: 11px; fill: #374151; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, LabelList } = window.Recharts;

        // Base histórica 2025
        const data2025 = {
            "Ene": { total: 22, tier1: 9 }, "Feb": { total: 5, tier1: 2 }, "Mar": { total: 25, tier1: 12 },
            "Abr": { total: 24, tier1: 12 }, "May": { total: 35, tier1: 17 }, "Jun": { total: 75, tier1: 31 },
            "Jul": { total: 41, tier1: 14 }, "Ago": { total: 47, tier1: 16 }, "Sep": { total: 22, tier1: 15 },
            "Oct": { total: 47, tier1: 18 }, "Nov": { total: 49, tier1: 12 }, "Dic": { total: 15, tier1: 11 }
        };

        const cumulative2025_T1 = {
            "Ene": 9, "Feb": 11, "Mar": 23, "Abr": 35, "May": 52, "Jun": 107, 
            "Jul": 121, "Ago": 137, "Sep": 152, "Oct": 170, "Nov": 182, "Dic": 168
        };

        const allMonths = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        
        // PALETAS DE COLORES
        const COLORS_PIE = ['#00A859', '#0B2027', '#f59e0b', '#9ca3af', '#10b981', '#64748b'];
        const TIER_COLORS = ['#00A859', '#9ca3af', '#4b5563']; // T1: Verde, T2: Gris claro, T3: Gris oscuro
        const COLORS_VOCEROS = ['#00A859', '#f59e0b', '#0B2027', '#10b981', '#64748b', '#8b5cf6'];

        const Icon = ({ name, size=24, className="" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const KPICard = ({ title, value, subtitle, icon, colorClass = "text-unipar-green" }) => (
            <div className="card flex items-center p-6 transition-transform hover:-translate-y-1 hover:shadow-lg">
                <div className={`p-4 rounded-full bg-gray-50 mr-4 ${colorClass}`}>
                    <Icon name={icon} size={28} />
                </div>
                <div>
                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">{title}</h3>
                    <p className="text-3xl font-bold text-gray-900 mt-1">{value}</p>
                    {subtitle && <p className="text-sm text-gray-500 mt-1">{subtitle}</p>}
                </div>
            </div>
        );

        const App = () => {
            const [fullData, setFullData] = useState(null); 
            const [selectedFilter, setSelectedFilter] = useState("H1"); 
            const [fileName, setFileName] = useState("");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(true);
            const fileInputRef = useRef(null);

            useEffect(() => {
                fetch('data.json')
                    .then(res => {
                        if (!res.ok) throw new Error("No se pudo cargar data.json");
                        return res.json();
                    })
                    .then(data => {
                        setFullData(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.warn("Carga remota fallida:", err);
                        setLoading(false);
                    });
            }, []);

            const normalizeVal = (val) => val ? String(val).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
            
            const getMonthFromExcel = (val) => {
                if (!val) return 'Otro';
                if (typeof val === 'number') {
                    const excelEpoch = new Date(Math.round((val - 25569) * 86400 * 1000));
                    const m = excelEpoch.getUTCMonth();
                    return allMonths[m] || 'Otro';
                }
                const lower = normalizeVal(val);
                if (lower.startsWith('01/') || lower.includes('/01/') || lower === '1' || lower.includes('ene') || lower.includes('jan')) return 'Ene';
                if (lower.startsWith('02/') || lower.includes('/02/') || lower === '2' || lower.includes('feb')) return 'Feb';
                if (lower.startsWith('03/') || lower.includes('/03/') || lower === '3' || lower.includes('mar')) return 'Mar';
                if (lower.startsWith('04/') || lower.includes('/04/') || lower === '4' || lower.includes('abr') || lower.includes('apr')) return 'Abr';
                if (lower.startsWith('05/') || lower.includes('/05/') || lower === '5' || lower.includes('may')) return 'May';
                if (lower.startsWith('06/') || lower.includes('/06/') || lower === '6' || lower.includes('jun')) return 'Jun';
                if (lower.startsWith('07/') || lower.includes('/07/') || lower === '7' || lower.includes('jul')) return 'Jul';
                if (lower.startsWith('08/') || lower.includes('/08/') || lower === '8' || lower.includes('ago')) return 'Ago';
                if (lower.startsWith('09/') || lower.includes('/09/') || lower === '9' || lower.includes('sep')) return 'Sep';
                if (lower.startsWith('10/') || lower.includes('/10/') || lower === '10' || lower.includes('oct')) return 'Oct';
                if (lower.startsWith('11/') || lower.includes('/11/') || lower === '11' || lower.includes('nov')) return 'Nov';
                if (lower.startsWith('12/') || lower.includes('/12/') || lower === '12' || lower.includes('dic')) return 'Dic';
                return 'Otro';
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name);
                setError("");

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws);
                        
                        if (rawData.length === 0) throw new Error("El archivo está vacío.");

                        let colMes, colGestion, colTono, colTier, colAdValue, colTema, colTipoMedio, colMedio, colAlcance, colMC, colTipoNota, colVocero, colLink, colTitulo;
                        
                        Object.keys(rawData[0]).forEach((k, index) => {
                            const nk = normalizeVal(k);
                            if (!colMes && (nk === 'mes' || nk.includes('fecha') || nk === 'date')) colMes = k;
                            else if (!colGestion && (nk === 'gestion' || nk.includes('proactiva') || nk.includes('accion') || nk.includes('iniciativa'))) colGestion = k;
                            else if (!colTono && (nk.includes('tono') || nk.includes('sentimiento') || nk.includes('valoracion'))) colTono = k;
                            else if (!colTier && (nk === 'tier' || nk.includes('categoria'))) colTier = k;
                            else if (!colAdValue && (nk.includes('ad value') || nk.includes('advalue') || nk.includes('valor'))) colAdValue = k;
                            else if (!colTema && (nk.includes('eje') || nk === 'tema' || nk === 'tematica' || nk.includes('pilar') || index === 12)) colTema = k; 
                            else if (!colTipoMedio && (nk.includes('tipo de medio') || (nk.includes('tipo') && nk.includes('medio')))) colTipoMedio = k;
                            else if (!colMedio && (nk === 'medio' || nk === 'medios' || nk === 'soporte')) colMedio = k;
                            else if (!colAlcance && (nk.includes('alcance') || nk.includes('cobertura'))) colAlcance = k;
                            else if (!colMC && (nk.includes('mensaje') || nk === 'mc')) colMC = k;
                            else if (!colTipoNota && (nk.includes('tipo de nota') || nk.includes('organica') || nk.includes('pautada'))) colTipoNota = k;
                            else if (!colVocero && nk.includes('vocero') && !nk.includes('sin vocero')) colVocero = k; 
                            else if (!colLink && (nk.includes('link') || nk.includes('url'))) colLink = k;
                            else if (!colTitulo && (nk.includes('titulo') || nk.includes('titular'))) colTitulo = k;
                        });

                        const parsedData = rawData.map((row, i) => {
                            const gestionNorm = normalizeVal(row[colGestion] || '');
                            const rawStrRow = JSON.stringify(row).toLowerCase();
                            const isProactiva = gestionNorm.includes('proactiv') || rawStrRow.includes('proactiv');
                            
                            const valMC = normalizeVal(row[colMC] || '');
                            const hasMC = valMC === 'si' || valMC === 's' || valMC === '1' || valMC.includes('verdadero') || valMC.includes('true');

                            let tipoMedioVal = row[colTipoMedio] || 'No definido';
                            if (normalizeVal(tipoMedioVal).includes('negocio')) tipoMedioVal = 'Negocio Nacional';
                            
                            const alcanceRaw = normalizeVal(row[colAlcance] || tipoMedioVal);
                            const isLocal = alcanceRaw.includes('local') || alcanceRaw.includes('bahia') || alcanceRaw.includes('bb');
                            const alcanceVal = isLocal ? 'Local' : 'Nacional';

                            const tonoNorm = normalizeVal(row[colTono] || '');
                            let tonoF = 'Positiva'; 
                            if (tonoNorm.includes('negativ')) tonoF = 'Negativa';

                            const adValueStr = String(row[colAdValue] || '0').replace(/[^0-9,-]+/g,"").replace(',', '.');
                            const adValueNum = parseFloat(adValueStr) || 0;
                            const finalAdValue = typeof row[colAdValue] === 'number' ? row[colAdValue] : adValueNum;

                            return {
                                id: i,
                                mes: getMonthFromExcel(row[colMes]),
                                gestion: isProactiva ? 'Proactiva' : 'Espontánea',
                                tono: tonoF,
                                tier: colTier ? String(row[colTier]).replace(/\D/g, '').trim() || '3' : '3',
                                adValue: finalAdValue,
                                tema: colTema ? String(row[colTema]).trim() : 'Sin Tema',
                                tipoMedio: tipoMedioVal,
                                medio: colMedio ? String(row[colMedio]).trim() : 'Desconocido',
                                alcance: alcanceVal,
                                mensajesClave: hasMC,
                                tipoNota: colTipoNota ? (normalizeVal(row[colTipoNota]).includes('pautada') ? 'Pautada' : 'Orgánica') : 'Orgánica',
                                vocero: colVocero ? String(row[colVocero]).trim() : '',
                                link: colLink ? String(row[colLink]).trim() : '#',
                                titulo: colTitulo ? String(row[colTitulo]).trim() : `Nota #${i+1}`
                            };
                        });
                        
                        setFullData(parsedData);
                    } catch (err) {
                        setError("Error al procesar el archivo. Asegúrate de que sea el Excel correcto.");
                        console.error(err);
                    }
                };
                reader.readAsBinaryString(file);
            };

            const stats = useMemo(() => {
                if (!fullData) return null;

                let activeMonths = [];
                let lastMonthIndex = 11;

                if (selectedFilter === "H1") {
                    activeMonths = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];
                    lastMonthIndex = 5;
                } else if (selectedFilter === "Anual") {
                    activeMonths = allMonths;
                    lastMonthIndex = 11;
                } else {
                    activeMonths = [selectedFilter];
                    lastMonthIndex = allMonths.indexOf(selectedFilter);
                }

                const periodData = fullData.filter(d => activeMonths.includes(d.mes));
                const dataUpToCorte = fullData.filter(d => allMonths.indexOf(d.mes) <= lastMonthIndex);

                const total = periodData.length; 
                const proactivas = periodData.filter(d => d.gestion === "Proactiva");
                const espontaneas = periodData.filter(d => d.gestion === "Espontánea");
                const proactivasPct = total > 0 ? Math.round((proactivas.length / total) * 100) : 0;
                
                const positivasCount = periodData.filter(d => d.tono === "Positiva").length;
                const repercusionesT1 = periodData.filter(d => d.tier === "1").length;
                const adValueT1 = periodData.filter(d => d.tier === "1").reduce((acc, curr) => acc + curr.adValue, 0);

                // --- PILARES ACUMULADOS YTD ---
                const temasCount = dataUpToCorte.reduce((acc, curr) => {
                    let tema = curr.tema;
                    const temaNorm = normalizeVal(tema);
                    if(temaNorm.includes('institucional')) tema = 'Institucional';
                    else if(temaNorm.includes('sustentabilidad')) tema = 'Sustentabilidad';
                    else if(temaNorm.includes('proveedor') || temaNorm.includes('estrategico')) tema = 'Prov. Estratégico';
                    else return acc; 

                    acc[tema] = (acc[tema] || 0) + 1;
                    return acc;
                }, {});
                
                const totalPilares = Object.values(temasCount).reduce((a, b) => a + b, 0);
                const temasData = Object.keys(temasCount).map(tema => ({
                    name: tema, value: temasCount[tema], pct: totalPilares > 0 ? Math.round((temasCount[tema] / totalPilares) * 100) : 0
                })).sort((a,b) => b.value - a.value);

                // Tipo de Medios
                const tipoMedioCount = periodData.reduce((acc, curr) => {
                    acc[curr.tipoMedio] = (acc[curr.tipoMedio] || 0) + 1;
                    return acc;
                }, {});
                const tipoMedioData = Object.keys(tipoMedioCount).map(tipo => ({
                    name: tipo, value: tipoMedioCount[tipo], pct: Math.round((tipoMedioCount[tipo] / total) * 100)
                })).sort((a,b) => b.value - a.value);

                // Top Medios
                const getTop3 = (alcanceStr) => {
                    const agrupados = periodData.filter(d => d.alcance === alcanceStr).reduce((acc, curr) => {
                        acc[curr.medio] = (acc[curr.medio] || 0) + 1;
                        return acc;
                    }, {});
                    return Object.entries(agrupados).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([name, count]) => ({ name, count }));
                };
                const topNacionales = getTop3("Nacional");
                const topLocales = getTop3("Local");
                const totalNacionales = periodData.filter(d => d.alcance === "Nacional").length;
                const totalLocales = periodData.filter(d => d.alcance === "Local").length;

                // Mensajes Clave
                const espontaneasConMensaje = espontaneas.filter(d => d.mensajesClave).length;
                const proactivasConMensaje = proactivas.filter(d => d.mensajesClave).length;

                // Tier Distribution
                const tierCounts = [
                    { name: 'Tier 1', Cantidad: repercusionesT1 },
                    { name: 'Tier 2', Cantidad: periodData.filter(d => d.tier === "2").length },
                    { name: 'Tier 3', Cantidad: periodData.filter(d => d.tier === "3").length }
                ];

                // Sentimiento vs Tier 1
                const tonoData = [
                    { name: 'Total', Positivas: positivasCount, Negativas: periodData.filter(d => d.tono === "Negativa").length },
                    { name: 'En Tier 1', Positivas: periodData.filter(d => d.tono === "Positiva" && d.tier === "1").length, Negativas: periodData.filter(d => d.tono === "Negativa" && d.tier === "1").length }
                ];

                // Tipo Nota vs Tier 1
                const tipoNotaData = [
                    { name: 'Orgánicas', Total: periodData.filter(d => d.tipoNota === "Orgánica").length, 'En Tier 1': periodData.filter(d => d.tipoNota === "Orgánica" && d.tier === "1").length },
                    { name: 'Pautadas', Total: periodData.filter(d => d.tipoNota === "Pautada").length, 'En Tier 1': periodData.filter(d => d.tipoNota === "Pautada" && d.tier === "1").length }
                ];

                // Voceros (Filtro Inteligente y estricto para "No menciona")
                const vocerosMap = {};
                let notasUnicasConVocero = new Set();
                
                periodData.forEach(d => {
                    const vocRaw = String(d.vocero || '');
                    const vocNorm = normalizeVal(vocRaw);
                    const isInvalidVocero = !vocNorm || vocNorm === "" || vocNorm.includes("ninguno") || vocNorm === "n/a" || vocNorm.includes("no aplica") || vocNorm.includes("no menciona") || vocNorm.includes("sin vocero") || vocNorm.trim() === "-";
                    
                    if(!isInvalidVocero) {
                        const voceros = vocRaw.split(/,| y | e /).map(v => v.trim()).filter(v => v.length > 2 && normalizeVal(v) !== "n/a" && !normalizeVal(v).includes("no menciona"));
                        if (voceros.length > 0) notasUnicasConVocero.add(d.id); 
                        
                        voceros.forEach(v => {
                            if(!vocerosMap[v]) vocerosMap[v] = { count: 0, links: [] };
                            vocerosMap[v].count++;
                            if (d.link && d.link !== '#') {
                                vocerosMap[v].links.push({ title: d.titulo, url: d.link, tier: d.tier });
                            }
                        });
                    }
                });
                
                const totalMencionesVoceros = notasUnicasConVocero.size;
                
                const vocerosData = Object.entries(vocerosMap)
                    .map(([name, info]) => ({
                        name, 
                        count: info.count, 
                        pctTotal: total > 0 ? Math.round((info.count / total) * 100) : 0, 
                        pctMencion: totalMencionesVoceros > 0 ? Math.round((info.count / totalMencionesVoceros) * 100) : 0, 
                        links: info.links
                    }))
                    .sort((a,b) => b.count - a.count);

                const linksT1Proactivas = proactivas.filter(d => d.tier === "1" && d.link && d.link !== '#').map(d => ({title: d.titulo, url: d.link}));
                const linksT1Espontaneas = espontaneas.filter(d => d.tier === "1" && d.link && d.link !== '#').map(d => ({title: d.titulo, url: d.link}));

                // Comparativo Anual Evolutivo
                const currentMonthName = allMonths[lastMonthIndex] || "Dic";
                const is31Days = ['Ene','Mar','May','Jul','Ago','Oct','Dic'].includes(currentMonthName);
                const is28Days = currentMonthName === 'Feb';
                const lastDay = is31Days ? '31' : (is28Days ? '28' : '30');
                const targetDateText = `${lastDay} ${currentMonthName} 2026`;
                
                const t1_2026_Cumulative = dataUpToCorte.filter(d => d.tier === "1").length;
                const t1_2025_Cumulative = cumulative2025_T1[currentMonthName] || 168;

                const chartMonths = allMonths.slice(0, lastMonthIndex + 1);
                const yoyData = chartMonths.map(mes => {
                    const mes2026 = fullData.filter(d => d.mes === mes);
                    const d25 = data2025[mes] || {total: 0, tier1: 0};
                    return {
                        mes: mes,
                        'Total 2025': d25.total, 'Tier 1 2025': d25.tier1, 'No Tier 1 2025': d25.total - d25.tier1,
                        'Total 2026': mes2026.length, 'Tier 1 2026': mes2026.filter(d => d.tier === "1").length, 'No Tier 1 2026': mes2026.length - mes2026.filter(d => d.tier === "1").length
                    };
                });

                return {
                    total, proactivas: proactivas.length, proactivasPct, positivasCount, repercusionesT1, adValueT1,
                    temasData, tipoMedioData, topNacionales, topLocales, totalNacionales, totalLocales,
                    espontaneas: espontaneas.length, espontaneasConMensaje, proactivasConMensaje,
                    tierCounts, tonoData, tipoNotaData,
                    vocerosData, totalMencionesVoceros, linksT1Proactivas, linksT1Espontaneas, yoyData,
                    t1_2026_Cumulative, t1_2025_Cumulative, targetDateText, currentMonthName, selectedFilter
                };
            }, [fullData, selectedFilter]);

            const formatARS = (value) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(value);

            if (!fullData) {
                return (
                    <div className="min-h-screen bg-unipar-light flex flex-col items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-unipar-green">
                            <div className="w-20 h-20 bg-unipar-green rounded-full flex items-center justify-center text-white font-bold text-3xl mx-auto mb-6 shadow-lg">U</div>
                            <h2 className="text-2xl font-bold text-unipar-dark mb-2">Dashboard Prensa 2026</h2>
                            <p className="text-gray-500 mb-8">Sube tu Excel. Luego podrás elegir ver el H1, el año completo, o cualquier mes en particular.</p>
                            
                            <div className="relative group cursor-pointer">
                                <div className="absolute -inset-1 bg-gradient-to-r from-unipar-green to-emerald-600 rounded-lg blur opacity-25 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
                                <div className="relative border-2 border-dashed border-gray-300 rounded-lg p-6 bg-white flex flex-col items-center hover:border-unipar-green transition-colors">
                                    <Icon name="upload-cloud" size={48} className="text-unipar-green mb-3" />
                                    <span className="text-sm font-semibold text-gray-700">Subir Archivo Excel</span>
                                    <span className="text-xs text-gray-400 mt-1">.xlsx, .xls, .csv</span>
                                    <input type="file" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} ref={fileInputRef}/>
                                </div>
                            </div>
                            {error && <p className="text-red-500 text-sm mt-4 p-3 bg-red-50 rounded-lg border border-red-100">{error}</p>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-unipar-light p-4 md:p-8">
                    {/* Header Interactivo */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border-l-4 border-unipar-green">
                        <div className="flex items-center space-x-4">
                            <div className="w-12 h-12 bg-unipar-green rounded-lg flex items-center justify-center text-white font-bold text-xl shadow">U</div>
                            <div>
                                <h1 className="text-2xl font-bold text-unipar-dark">Dashboard de Prensa</h1>
                                <p className="text-gray-500">Periodo Analizado: <span className="font-semibold text-unipar-green">{stats.selectedFilter === 'H1' ? 'Primer Semestre (H1)' : stats.selectedFilter === 'Anual' ? 'Año Completo 2026' : `Mes de ${stats.selectedFilter}`}</span></p>
                            </div>
                        </div>
                        <div className="mt-4 md:mt-0 flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-4">
                            <div className="flex items-center bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">
                                <label className="text-sm font-semibold text-gray-600 mr-2">Filtrar:</label>
                                <select value={selectedFilter} onChange={(e) => setSelectedFilter(e.target.value)} className="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-unipar-green focus:border-unipar-green p-1 font-semibold cursor-pointer outline-none">
                                    <option value="H1">Primer Semestre (H1)</option>
                                    <option value="Anual">Año Completo (2026)</option>
                                    <optgroup label="Meses">
                                        {allMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                    </optgroup>
                                </select>
                            </div>
                            <button onClick={() => setFullData(null)} className="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2.5 rounded-lg transition-colors font-medium">Subir otro archivo</button>
                        </div>
                    </div>

                    {/* KPI Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 mb-8">
                        <KPICard title={`Notas Totales (${stats.selectedFilter})`} value={stats.total} icon="file-text" colorClass="text-unipar-dark" />
                        <KPICard title="Notas Proactivas" value={stats.proactivas} subtitle={`Representa el ${stats.proactivasPct}% del periodo`} icon="check-circle" colorClass="text-unipar-green" />
                        <KPICard title="Notas Positivas" value={stats.positivasCount} subtitle={`${stats.total > 0 ? Math.round((stats.positivasCount/stats.total)*100) : 0}% de sentimiento favorable`} icon="smile" colorClass="text-unipar-green" />
                        <KPICard title="Repercusiones Tier 1" value={stats.repercusionesT1} subtitle={`De ${stats.total} notas totales`} icon="star" colorClass="text-orange-500" />
                        <KPICard title="AD Value Tier 1" value={formatARS(stats.adValueT1)} subtitle="Pesos Argentinos" icon="dollar-sign" colorClass="text-unipar-dark" />
                    </div>

                    {/* Fila 2: Distribuciones Absolutas (Tortas con números visibles) */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                        
                        <div className="card">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Acumulado YTD por Pilares</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart margin={{ top: 20, right: 30, bottom: 20, left: 30 }}>
                                        <Pie 
                                            data={stats.temasData} 
                                            innerRadius={35} 
                                            outerRadius={65} 
                                            dataKey="value"
                                            label={({name, value}) => `${name}: ${value}`}
                                            labelLine={true}
                                        >
                                            {stats.temasData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS_PIE[index % COLORS_PIE.length]} />)}
                                        </Pie>
                                        <Tooltip formatter={(value, name, props) => [`${value} notas (${props.payload.pct}%)`, name]} />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="card">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Clasificación por Tipo de Medio</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart margin={{ top: 20, right: 30, bottom: 20, left: 30 }}>
                                        <Pie 
                                            data={stats.tipoMedioData} 
                                            innerRadius={0} 
                                            outerRadius={65} 
                                            dataKey="value"
                                            label={({name, value}) => `${name}: ${value}`}
                                            labelLine={true}
                                        >
                                            {stats.tipoMedioData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS_PIE[(index + 2) % COLORS_PIE.length]} />)}
                                        </Pie>
                                        <Tooltip formatter={(value, name, props) => [`${value} notas (${props.payload.pct}%)`, name]} />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="card flex flex-col justify-between">
                            <div className="flex justify-between items-center mb-4 bg-gray-50 p-2 rounded border border-gray-100">
                                <div className="text-center w-1/2 border-r border-gray-200">
                                    <span className="block text-xs text-gray-500 uppercase">Nacionales</span>
                                    <span className="text-xl font-bold text-orange-500">{stats.total > 0 ? Math.round((stats.totalNacionales/stats.total)*100) : 0}%</span>
                                </div>
                                <div className="text-center w-1/2">
                                    <span className="block text-xs text-gray-500 uppercase">Locales (BB)</span>
                                    <span className="text-xl font-bold text-gray-600">{stats.total > 0 ? Math.round((stats.totalLocales/stats.total)*100) : 0}%</span>
                                </div>
                            </div>
                            <div className="mb-2">
                                <h3 className="text-sm font-semibold text-gray-800 mb-2 border-b pb-1">Top 3 Nacionales ({stats.totalNacionales} notas)</h3>
                                <ul className="space-y-1">
                                    {stats.topNacionales.map((m, i) => (
                                        <li key={i} className="flex justify-between items-center text-sm"><span className="text-gray-700 truncate pr-2">{i+1}. {m.name}</span><span className="font-bold text-orange-500">{m.count}</span></li>
                                    ))}
                                </ul>
                            </div>
                            <div>
                                <h3 className="text-sm font-semibold text-gray-800 mb-2 border-b pb-1">Top 3 Locales ({stats.totalLocales} notas)</h3>
                                <ul className="space-y-1">
                                    {stats.topLocales.map((m, i) => (
                                        <li key={i} className="flex justify-between items-center text-sm"><span className="text-gray-700 truncate pr-2">{i+1}. {m.name}</span><span className="font-bold text-gray-600">{m.count}</span></li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>

                    {/* Fila 3: Análisis de Gestión y Tiers */}
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
                        <div className="card lg:col-span-1 flex flex-col justify-center">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Mensajes Clave</h3>
                            <div className="space-y-6">
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="font-medium text-gray-600">En Proactivas ({stats.proactivas})</span>
                                        <span className="text-unipar-green font-bold">{stats.proactivas > 0 ? Math.round((stats.proactivasConMensaje/stats.proactivas)*100) : 0}%</span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div className="bg-unipar-green h-2 rounded-full" style={{width: `${stats.proactivas > 0 ? (stats.proactivasConMensaje/stats.proactivas)*100 : 0}%`}}></div>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">{stats.proactivasConMensaje} notas incluyen M.C.</p>
                                </div>
                                <div>
                                    <div className="flex justify-between text-sm mb-1">
                                        <span className="font-medium text-gray-600">En Espontáneas ({stats.espontaneas})</span>
                                        <span className="text-orange-500 font-bold">{stats.espontaneas > 0 ? Math.round((stats.espontaneasConMensaje/stats.espontaneas)*100) : 0}%</span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                        <div className="bg-orange-500 h-2 rounded-full" style={{width: `${stats.espontaneas > 0 ? (stats.espontaneasConMensaje/stats.espontaneas)*100 : 0}%`}}></div>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">{stats.espontaneasConMensaje} notas incluyen M.C.</p>
                                </div>
                            </div>
                        </div>

                        <div className="card lg:col-span-1">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Notas por Tier</h3>
                            <div className="h-48">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={stats.tierCounts} margin={{top: 20, right: 10, left: -20, bottom: 5}}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false}/>
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip cursor={{fill: 'transparent'}}/>
                                        <Bar dataKey="Cantidad">
                                            {stats.tierCounts.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={TIER_COLORS[index % TIER_COLORS.length]} />
                                            ))}
                                            <LabelList dataKey="Cantidad" position="top" style={{ fontSize: '13px', fontWeight: 'bold', fill: '#1f2937' }} />
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="card lg:col-span-1">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Sentimiento General</h3>
                            <div className="h-48">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={stats.tonoData} margin={{top: 25, right: 0, left: -20, bottom: 5}}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false}/>
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip cursor={{fill: 'transparent'}}/>
                                        <Legend wrapperStyle={{fontSize: "10px"}} />
                                        <Bar dataKey="Positivas" fill="#00A859" radius={[4, 4, 0, 0]}>
                                            <LabelList dataKey="Positivas" position="top" formatter={(val) => val > 0 ? val : ''} style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        </Bar>
                                        <Bar dataKey="Negativas" fill="#ef4444" radius={[4, 4, 0, 0]}>
                                            <LabelList dataKey="Negativas" position="top" formatter={(val) => val > 0 ? val : ''} style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="card lg:col-span-1">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Orgánicas / Pautadas</h3>
                            <div className="h-48">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={stats.tipoNotaData} margin={{top: 25, right: 0, left: -20, bottom: 5}}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false}/>
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip cursor={{fill: 'transparent'}}/>
                                        <Legend wrapperStyle={{fontSize: "10px"}}/>
                                        <Bar dataKey="Total" fill="#f59e0b" radius={[4, 4, 0, 0]}>
                                            <LabelList dataKey="Total" position="top" style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        </Bar>
                                        <Bar dataKey="En Tier 1" fill="#0B2027" radius={[4, 4, 0, 0]}>
                                            <LabelList dataKey="En Tier 1" position="top" style={{ fontSize: '11px', fontWeight: 'bold' }} />
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* Fila 4: Voceros y Comparativo Anual + Meta Target */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                        {/* Voceros */}
                        <div className="card flex flex-col max-h-[600px]">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Menciones a Voceros</h3>
                            
                            <div className="text-center mb-4 border-b pb-2">
                                <span className="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded-full font-medium">
                                    Notas reales con presencia de voceros: <span className="font-bold text-unipar-dark">{stats.totalMencionesVoceros}</span>
                                </span>
                            </div>
                            
                            {stats.vocerosData.length > 0 && (
                                <div className="h-48 mb-4 border-b border-gray-100 pb-4">
                                    <p className="text-xs text-gray-500 mb-2 font-medium uppercase text-center">Top Voceros con mayor participación</p>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={stats.vocerosData.slice(0, 6)} layout="vertical" margin={{top: 5, right: 30, left: 10, bottom: 5}}>
                                            <CartesianGrid strokeDasharray="3 3" horizontal={false}/>
                                            <XAxis type="number" hide={true}/>
                                            <YAxis dataKey="name" type="category" width={110} tick={{fontSize: 11, fill: '#374151', fontWeight: 600}}/>
                                            <Tooltip cursor={{fill: 'transparent'}} formatter={(value, name, props) => [`${value} notas (${props.payload.pctMencion}% de las notas con vocero)`, "Cantidad"]}/>
                                            <Bar dataKey="count" radius={[0, 4, 4, 0]} name="Cantidad de Notas">
                                                {stats.vocerosData.slice(0, 6).map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={COLORS_VOCEROS[index % COLORS_VOCEROS.length]} />
                                                ))}
                                                <LabelList dataKey="count" position="right" style={{ fontSize: '12px', fontWeight: 'bold', fill: '#1f2937' }} />
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            )}

                            <p className="text-xs text-gray-500 mb-2 font-medium uppercase">Detalle y Enlaces</p>
                            <div className="overflow-y-auto custom-scrollbar flex-1 pr-2">
                                {stats.vocerosData.length === 0 && <p className="text-gray-500 text-sm text-center italic mt-4">No se encontraron voceros en este periodo.</p>}
                                {stats.vocerosData.map((v, i) => (
                                    <div key={i} className="mb-4 border border-gray-100 rounded-lg p-3 bg-gray-50/50 hover:border-unipar-green transition-colors">
                                        <div className="flex flex-col mb-2">
                                            <span className="font-bold text-gray-800 text-base mb-1">{v.name}</span>
                                            <div className="flex space-x-2">
                                                <span className="text-xs bg-white border border-green-200 px-2 py-1 rounded shadow-sm text-unipar-green font-semibold">
                                                    {v.count} notas ({v.pctMencion}% c/voceros)
                                                </span>
                                                <span className="text-xs bg-gray-100 border border-gray-200 px-2 py-1 rounded shadow-sm text-gray-600 font-semibold">
                                                    {v.pctTotal}% del total periodo
                                                </span>
                                            </div>
                                        </div>
                                        {v.links.length > 0 ? (
                                            <div className="mt-2 text-sm text-gray-600 border-t border-gray-200 pt-2">
                                                <ul className="list-disc pl-5 space-y-1">
                                                    {v.links.map((link, idx) => (
                                                        <li key={idx}>
                                                            <a href={link.url} target="_blank" rel="noreferrer" className="text-unipar-green hover:underline">
                                                                {link.title} <span className="text-xs text-gray-400 border border-gray-200 rounded px-1 ml-1">Tier {link.tier}</span>
                                                            </a>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        ) : (
                                            <p className="text-xs text-gray-400 mt-1">Sin enlaces disponibles.</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Comparativo Anual Evolutivo y Meta Target */}
                        <div className="card flex flex-col relative max-h-[600px]">
                            <h3 className="text-lg font-semibold text-gray-800 mb-2 border-b pb-2">Evolución Anual (2025 vs 2026)</h3>
                            <p className="text-xs text-gray-500 mb-4">Gráfico Evolutivo: De Enero hasta {stats.currentMonthName}.</p>
                            
                            <div className="flex-1 flex flex-col md:flex-row h-72 relative gap-2">
                                {/* Gráfico de barras */}
                                <div className="w-full md:w-3/4 h-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={stats.yoyData} margin={{ top: 25, right: 10, bottom: 0, left: -20 }}>
                                            <CartesianGrid stroke="#f5f5f5" vertical={false} />
                                            <XAxis dataKey="mes" />
                                            <YAxis />
                                            <Tooltip cursor={{fill: 'transparent'}}/>
                                            <Legend verticalAlign="bottom" height={20}/>
                                            
                                            <Bar dataKey="Tier 1 2025" stackId="2025" fill="#4b5563" barSize={25}>
                                                <LabelList dataKey="Tier 1 2025" position="center" fill="#ffffff" style={{ fontSize: '10px', fontWeight: 'bold' }} formatter={(val) => val > 0 ? val : ''} />
                                            </Bar>
                                            <Bar dataKey="No Tier 1 2025" stackId="2025" fill="#d1d5db" barSize={25}>
                                                <LabelList dataKey="No Tier 1 2025" position="center" fill="#374151" style={{ fontSize: '10px', fontWeight: 'bold' }} formatter={(val) => val > 0 ? val : ''} />
                                                <LabelList dataKey="Total 2025" position="top" style={{ fontSize: '11px', fill: '#4b5563', fontWeight: 'bold' }} />
                                            </Bar>
                                            
                                            <Bar dataKey="Tier 1 2026" stackId="2026" fill="#00A859" barSize={25}>
                                                <LabelList dataKey="Tier 1 2026" position="center" fill="#ffffff" style={{ fontSize: '10px', fontWeight: 'bold' }} formatter={(val) => val > 0 ? val : ''} />
                                            </Bar>
                                            <Bar dataKey="No Tier 1 2026" stackId="2026" fill="#86efac" barSize={25}>
                                                <LabelList dataKey="No Tier 1 2026" position="center" fill="#065f46" style={{ fontSize: '10px', fontWeight: 'bold' }} formatter={(val) => val > 0 ? val : ''} />
                                                <LabelList dataKey="Total 2026" position="top" style={{ fontSize: '11px', fill: '#00A859', fontWeight: 'bold' }} />
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                
                                {/* Tarjeta Target (Meta) Acumulada Dinámica */}
                                <div className="w-full md:w-1/3 pt-4 md:pt-0 flex flex-col justify-center">
                                    <div className="bg-[#f0eedd] rounded-xl p-4 shadow-sm border border-[#e4e2d3] text-sm flex-1 max-h-[300px]">
                                        <div className="flex items-center mb-3 text-unipar-green font-bold text-lg">
                                            <span className="mr-2 text-xl">🇦🇷</span> AR <span className="text-xs text-gray-500 font-normal ml-1">(anual)</span>
                                        </div>
                                        <a href="#" className="text-unipar-dark underline font-medium block mb-4 leading-tight hover:text-unipar-green">
                                            Meta anual: Crescimento em até 10% em exposição em veículos Tier1
                                        </a>
                                        <p className="text-unipar-dark font-semibold mb-1">Total tier 1 2025: <span className="text-unipar-green">168</span></p>
                                        <p className="bg-unipar-green text-white font-bold inline-block px-1 mb-5 rounded">
                                            Total tier 1 2026: {stats.t1_2026_Cumulative}
                                        </p>
                                        
                                        <a href="#" className="text-unipar-dark underline font-medium block mb-2 leading-tight uppercase">
                                            Previa até {stats.targetDateText} – TIER1
                                        </a>
                                        <p className="text-unipar-dark font-semibold">Total tier 1 até {stats.currentMonthName} 2025: <span className="text-unipar-green">{stats.t1_2025_Cumulative}</span></p>
                                        <p className="text-unipar-dark font-semibold mt-1">Total tier 1 até {stats.currentMonthName} 2026: <span className="text-unipar-green">{stats.t1_2026_Cumulative}</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Fila 5: Listados de Títulos y Links Tier 1 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {/* Proactivas T1 */}
                        <div className="card">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 flex items-center border-b pb-2">
                                <Icon name="link" size={18} className="mr-2 text-unipar-green" /> Títulos y Enlaces: Proactivas (Tier 1)
                            </h3>
                            <div className="max-h-60 overflow-y-auto custom-scrollbar pr-2">
                                <ul className="space-y-3">
                                    {stats.linksT1Proactivas.map((link, i) => (
                                        <li key={i} className="flex items-start text-sm bg-gray-50 p-3 rounded hover:bg-gray-100 transition-colors border border-gray-100">
                                            <Icon name="external-link" size={14} className="mr-2 mt-0.5 text-unipar-green flex-shrink-0" />
                                            <a href={link.url} target="_blank" rel="noreferrer" className="text-unipar-dark hover:text-unipar-green hover:underline font-medium">
                                                {link.title}
                                            </a>
                                        </li>
                                    ))}
                                    {stats.linksT1Proactivas.length === 0 && <p className="text-gray-500 text-sm">No hay notas Proactivas en Tier 1 con link en el periodo.</p>}
                                </ul>
                            </div>
                        </div>

                        {/* Espontáneas T1 */}
                        <div className="card">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4 flex items-center border-b pb-2">
                                <Icon name="link" size={18} className="mr-2 text-orange-500" /> Títulos y Enlaces: Espontáneas (Tier 1)
                            </h3>
                            <div className="max-h-60 overflow-y-auto custom-scrollbar pr-2">
                                <ul className="space-y-3">
                                    {stats.linksT1Espontaneas.map((link, i) => (
                                        <li key={i} className="flex items-start text-sm bg-gray-50 p-3 rounded hover:bg-gray-100 transition-colors border border-gray-100">
                                            <Icon name="external-link" size={14} className="mr-2 mt-0.5 text-orange-500 flex-shrink-0" />
                                            <a href={link.url} target="_blank" rel="noreferrer" className="text-unipar-dark hover:text-unipar-green hover:underline font-medium">
                                                {link.title}
                                            </a>
                                        </li>
                                    ))}
                                    {stats.linksT1Espontaneas.length === 0 && <p className="text-gray-500 text-sm">No hay notas Espontáneas en Tier 1 con link en el periodo.</p>}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
